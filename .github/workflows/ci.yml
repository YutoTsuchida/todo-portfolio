name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend-ci:
    name: backend-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://todo_test:ci_test_only@127.0.0.1:5432/todo_test
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: todo_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo_test -d todo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version-file: backend/.python-version
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked
      - run: uv run --locked alembic upgrade head
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest
