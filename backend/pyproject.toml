[project]
name = "todo-portfolio-backend"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.3",
    "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = [
    "httpx2==2.13.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
    "mypy==2.4.0",
]

[tool.uv]
package = false
required-version = "==0.13.6"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires the dedicated local PostgreSQL test database"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "tests"]
